# Reading threads.
#
# Two consumers, so the schema is load-bearing:
#   _layouts/post.html  matches `slugs` against a post's slug to show its "Reading thread" signal.
#   research.html       renders the thread strip and DERIVES each essay count by keeping only the
#                       slugs whose post has `withdrawn != true`. A withdrawal therefore drops out
#                       of the count on its own and the number cannot drift from the corpus.
#
# Membership mirrors the thread hub pages under research/, which are what readers land on.
# Order matters: where two threads share a slug, post.html takes the first match.

