# Site Configuration
version: "3.2"
codename: "Resolution"
title: "Crip Minds"
description: "Experimental editorial publication asking what disabled ways of seeing can reveal about culture, science, technology, and ordinary life."
author: "Crip Minds"
og_image: /assets/og-card.png
url: "https://cripminds.com"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/
  collective:
    output: true
    permalink: /collective/:name/
  works:
    output: true
    permalink: /works/:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Note: RSS feeds (feed.xml + the four persona feeds) are hand-authored Liquid
# templates, not generated by the jekyll-feed plugin (a static feed.xml already
# exists at the plugin's default output path, which suppresses its generation).
# A prior "feed:" config block here (path/template/limit/description/author/
# categories) never actually drove any of these templates' behavior — removed
# 2026-08-20 as inert config. See feed.xml and feed-*.xml for actual behavior.

# SEO
lang: en
timezone: Europe/Amsterdam
future: true
twitter:
  username: cripminds
tagline: "Not writing about disability — seeing the world through it."

# Exclude from processing
exclude:
  - README.md
  - node_modules
  - vendor
  - "*.py"
  - "*.db"
  - automation/
  - archive/
  - docs/
  - MANIFESTO.md
  - PIPELINE.md
  - SCRAPING_ETHICS.md
  - accessibility/
  - reader-lab-worker/
  - requirements.txt
  - cripminds-stats-2026-06.html
  - calibration/
  - reader-lab/

# Site defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Crip Minds"
